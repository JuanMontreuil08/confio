[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 921600

; Original USB target remains the default. WiFi uses the same I2S and button pins.
[env:esp32wifi]
extends = env:esp32dev
build_flags = -DCONFIO_WIFI
lib_deps = links2004/WebSockets@2.7.2
