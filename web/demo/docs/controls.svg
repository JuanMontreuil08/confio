<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="338" viewBox="0 0 1000 338" role="img" aria-labelledby="title desc">
  <title id="title">Confio demo controls</title>
  <desc id="desc">The agent card contains the microphone and end call controls. The camera shows before and after images. The demo phone displays calls and SMS.</desc>
  <rect width="1000" height="338" rx="24" fill="#f5f5f7"/>
  <g fill="#fff" stroke="#e0e0e5">
    <rect x="20" y="20" width="365" height="219" rx="24"/>
    <rect x="401" y="20" width="291" height="219" rx="24"/>
    <rect x="708" y="20" width="272" height="219" rx="24"/>
    <rect x="20" y="254" width="960" height="64" rx="20"/>
  </g>
  <g font-family="system-ui,sans-serif" fill="#1d1d1f">
    <g font-size="21" font-weight="700">
      <text x="42" y="58">Confio Agent</text>
      <text x="423" y="58">ESP32-CAM</text>
      <text x="730" y="58">Demo phone</text>
      <text x="42" y="293">Conversation</text>
    </g>
    <g font-size="14" fill="#515158">
      <text x="42" y="200">Hold to talk</text><text x="139" y="200">End call</text>
      <text x="423" y="200">Before</text><text x="553" y="200">After</text>
      <text x="730" y="200">Calls and SMS · simulated</text>
      <text x="201" y="293">Each request appears immediately; the dots pulse until the answer is ready.</text>
    </g>
    <circle cx="76" cy="145" r="26" fill="#e5efff"/>
    <rect x="72" y="130" width="8" height="17" rx="4" fill="#0071e3"/>
    <path d="M67 142v3a9 9 0 0 0 18 0v-3m-9 12v5m-5 0h10" fill="none" stroke="#0071e3" stroke-width="2" stroke-linecap="round"/>
    <circle cx="165" cy="145" r="26" fill="#ffe9e8"/><rect x="157" y="137" width="16" height="16" rx="4" fill="#d9363e"/>
    <rect x="423" y="85" width="115" height="94" rx="12" fill="#626875"/>
    <rect x="553" y="85" width="115" height="94" rx="12" fill="#e5efff"/>
    <path d="m434 162 28-34 23 20 17-25 24 39m39 0 28-34 23 20 17-25 24 39" fill="none" stroke="#879ab9" stroke-width="3"/>
    <rect x="730" y="91" width="227" height="59" rx="18" fill="#222225"/>
    <text x="742" y="126" fill="white" font-size="14" font-weight="600">Incoming call</text>
    <circle cx="897" cy="121" r="14" fill="#d9363e"/><path d="m893 117 8 8m0-8-8 8" stroke="#fff" stroke-width="2"/>
    <circle cx="931" cy="121" r="14" fill="#258a48"/><path d="m926 121 3 3 7-7" fill="none" stroke="#fff" stroke-width="2"/>
  </g>
</svg>
