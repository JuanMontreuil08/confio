<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <title>Julio</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/telnyx-2.28.0.js" defer></script>
  <script src="app.js" type="module"></script>
</head>
<body>
  <main>
    <section class="experience" aria-label="Call with Julio" aria-describedby="demo-information">
      <div class="call-card">
        <div class="call-details">
          <div class="call-meta">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="timer" aria-label="Call duration">00:00</span>
          </div>
          <h1>Julio</h1>
          <div class="controls">
            <div class="control">
              <button id="stop" class="round-button stop-button" aria-label="End call" disabled>
                <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="7" width="18" height="18" rx="5" fill="currentColor"/></svg>
              </button>
              <span>End call</span>
            </div>
            <div class="control">
              <button id="mute" class="round-button mute-button" aria-label="Mute microphone" aria-pressed="false" disabled>
                <svg viewBox="0 0 32 32" aria-hidden="true">
                  <rect x="12" y="3" width="8" height="16" rx="4" fill="currentColor"/>
                  <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 14v2a8 8 0 0 0 16 0v-2M16 24v5M11 29h10"/></g>
                  <path class="mute-cross" d="m5 4 22 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
              </button>
              <span id="mute-label">Mute</span>
            </div>
          </div>
        </div>
        <div class="portrait"><img src="assets/profile.png" alt="Agent portrait, smiling by the sea" width="800" height="799"></div>
      </div>

      <div class="voice-area" aria-hidden="true"><canvas id="wave"></canvas></div>

      <section id="debug-panel" class="debug-panel" aria-label="Call activity" hidden>
        <div class="debug-header"><h2>Call activity</h2><span id="connection-label">Connecting</span></div>
        <ol id="logs" role="log" aria-live="polite" aria-relevant="additions"></ol>
      </section>

      <button id="start" class="start-button">
        <svg class="phone-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 2.8 9.1 7c.3.5.2 1-.2 1.4l-1.8 1.8a15 15 0 0 0 6.7 6.7l1.8-1.8c.4-.4.9-.5 1.4-.2l4.2 2.5c.5.3.7.8.5 1.3-.5 1.6-1.8 3.1-3.7 3.1C10 21.8 2.2 14 2.2 6c0-1.9 1.5-3.2 3.1-3.7.5-.2 1 .1 1.3.5Z" fill="currentColor"/></svg>
        <span>Talk with your agent</span>
        <svg class="button-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <p id="demo-information" class="sr-only">Browser call test. The microphone button mutes your voice. The waveform follows the other person's audio. No AI agent is connected yet.</p>
      <p id="call-status" class="sr-only" role="status"></p>
      <p id="device-status" class="sr-only" role="status"></p>
    </section>
  </main>
  <audio id="remote-audio" autoplay playsinline muted></audio>
</body>
</html>
